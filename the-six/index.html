<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">

  <title>THE SIX | Barbería</title>
  <meta name="description" content="THE SIX Barbería. Reserva tu hora, conoce nuestros servicios y encuentra cómo llegar.">

  <style>
    /* =========================
       1. CONFIGURACIÓN GENERAL
    ========================== */

    :root {
      --negro: #111111;
      --amarillo: #f5b800;
      --blanco: #ffffff;
      --gris: rgba(255,255,255,.68);
      --borde: rgba(255,255,255,.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      color: var(--blanco);
      font-family: Arial, Helvetica, sans-serif;

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.58) 0%,
          rgba(0,0,0,.78) 55%,
          rgba(0,0,0,.94) 100%
        ),
        url("fondo.jpg.jpeg") center / cover no-repeat fixed;

      display: flex;
      justify-content: center;
      align-items: center;
      padding: 48px 20px;
    }

    /* =========================
       2. CONTENEDOR PRINCIPAL
    ========================== */

    .contenedor {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* =========================
       3. ENCABEZADO
    ========================== */

    .encabezado {
      margin-bottom: 26px;
      animation: aparecer .8s ease both;
    }

    h1 {
      font-size: clamp(3rem, 12vw, 4rem);
      font-weight: 900;
      letter-spacing: 5px;
      line-height: 1;
    }

    .subtitulo {
      color: var(--amarillo);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: 5px;
      margin-top: 12px;
    }

    .linea {
      width: 42px;
      height: 3px;
      background: var(--amarillo);
      margin: 20px auto 0;
      border-radius: 10px;
    }

    /* =========================
       4. ESTADO DEL LOCAL
    ========================== */

    .estado {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 16px;
      margin-bottom: 32px;

      border: 1px solid var(--borde);
      border-radius: 30px;
      background: rgba(255,255,255,.05);

      font-size: .78rem;
      letter-spacing: .5px;
      color: var(--gris);
    }

    .estado::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #888;
    }

    .estado.on::before {
      background: #35d47b;
      box-shadow: 0 0 10px rgba(53,212,123,.6);
    }

    .estado.off::before {
      background: #ff5c5c;
      box-shadow: 0 0 8px rgba(255,92,92,.35);
    }

    /* =========================
       5. INFORMACIÓN
    ========================== */

    .informacion {
      width: 100%;
      text-align: left;
      margin-bottom: 30px;
      padding: 22px;

      background: rgba(15,15,15,.55);
      border: 1px solid var(--borde);
      border-radius: 16px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .fila {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 20px;

      color: var(--gris);
      font-size: .9rem;
      line-height: 1.6;
    }

    .fila:last-child {
      margin-bottom: 0;
    }

    .fila svg {
      width: 21px;
      height: 21px;
      flex: none;
      color: var(--amarillo);
      margin-top: 3px;
    }

    .fila b {
      display: block;
      margin-bottom: 3px;

      color: var(--amarillo);
      font-size: .7rem;
      letter-spacing: 2px;
    }

    /* =========================
       6. BOTONES
    ========================== */

    .botones {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      width: 100%;
      min-height: 57px;
      padding: 16px;

      color: var(--blanco);
      background: rgba(15,15,15,.55);
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 12px;

      text-decoration: none;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: 1.5px;

      transition:
        transform .25s ease,
        background .25s ease,
        color .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;

      animation: subir .65s ease both;
      animation-delay: var(--delay, 0s);
    }

    .btn svg {
      width: 19px;
      height: 19px;
      flex: none;
    }

    .btn.principal {
      color: var(--negro);
      background: var(--amarillo);
      border-color: var(--amarillo);
      box-shadow: 0 5px 22px rgba(245,184,0,.12);
    }

    .btn:hover {
      color: var(--negro);
      background: var(--blanco);
      border-color: var(--blanco);
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(0,0,0,.25);
    }

    .btn.principal:hover {
      background: #ffd044;
      border-color: #ffd044;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn:focus-visible {
      outline: 3px solid var(--amarillo);
      outline-offset: 4px;
    }

    /* =========================
       7. PIE DE PÁGINA
    ========================== */

    .footer {
      margin-top: 32px;
      color: rgba(255,255,255,.42);
      font-size: .68rem;
      letter-spacing: 2px;
      animation: aparecer 1s ease both;
      animation-delay: .8s;
    }

    .footer span {
      color: var(--amarillo);
    }

    /* =========================
       8. ANIMACIONES
    ========================== */

    @keyframes aparecer {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes subir {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       9. ADAPTACIÓN A CELULARES
    ========================== */

    @media (max-width: 480px) {
      body {
        padding: 38px 20px 30px;
        background-attachment: scroll;
      }

      .informacion {
        padding: 19px;
      }

      .btn {
        min-height: 55px;
      }
    }

    /* Respetar preferencias de movimiento */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

  <!-- ESTADO AUTOMÁTICO -->

  <script>
    function actualizarEstado() {
      const formato = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Santiago",
        weekday: "short",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      });

      const partes = formato.formatToParts(new Date());

      const obtener = tipo =>
        partes.find(parte => parte.type === tipo)?.value;

      const dia = obtener("weekday");
      const hora = Number(obtener("hour"));
      const minutos = Number(obtener("minute"));

      const diasAbiertos = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

      const abierto =
        diasAbiertos.includes(dia) &&
        (hora > 10 || (hora === 10 && minutos >= 0)) &&
        hora < 20;

      const estado = document.getElementById("estado");

      estado.textContent = abierto
        ? "Abierto ahora"
        : "Cerrado ahora";

      estado.classList.toggle("on", abierto);
      estado.classList.toggle("off", !abierto);
    }

    actualizarEstado();
    setInterval(actualizarEstado, 60000);
  </script>
