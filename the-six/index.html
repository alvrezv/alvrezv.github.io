
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#111111">
  <meta name="description" content="THE SIX Barbería. Reserva tu hora, conoce nuestros servicios y encuentra nuestra ubicación.">

  <title>THE SIX | Barbería</title>

  <style>
    /* =========================
       1. CONFIGURACIÓN GENERAL
    ========================== */

    :root {
      --black: #111111;
      --white: #ffffff;
      --yellow: #f5b800;
      --grey: #b8b8b8;
      --surface: rgba(20, 20, 20, 0.72);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      padding: 58px 22px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;

      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.62) 0%,
          rgba(0,0,0,.76) 45%,
          rgba(0,0,0,.93) 100%
        ),
        url("fondo.jpg.jpeg") center center / cover fixed no-repeat;

      background-color: var(--black);
    }

    /* =========================
       2. CONTENEDOR PRINCIPAL
    ========================== */

    .contenedor {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* =========================
       3. IDENTIDAD DE MARCA
    ========================== */

    .marca {
      text-align: center;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(2.8rem, 12vw, 3.6rem);
      font-weight: 900;
      letter-spacing: 4px;
      line-height: 1;
    }

    .subtitulo {
      color: var(--yellow);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: 5px;
      margin-top: 12px;
    }

    .linea {
      width: 38px;
      height: 2px;
      background: var(--yellow);
      margin: 19px auto 0;
    }

    /* =========================
       4. ESTADO DEL LOCAL
    ========================== */

    .estado {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 15px;
      margin-bottom: 30px;

      border: 1px solid rgba(255,255,255,.24);
      border-radius: 50px;
      background: rgba(0,0,0,.28);

      color: #eeeeee;
      font-size: .78rem;
      letter-spacing: .4px;
    }

    .estado::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #888888;
    }

    .estado.on::before {
      background: #39d98a;
      box-shadow: 0 0 9px rgba(57,217,138,.6);
    }

    .estado.off::before {
      background: #ff5b5b;
    }

    /* =========================
       5. INFORMACIÓN
    ========================== */

    .info {
      width: 100%;
      padding: 21px 20px 7px;
      margin-bottom: 22px;

      border: 1px solid rgba(255,255,255,.13);
      border-radius: 16px;
      background: var(--surface);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .fila {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 19px;

      color: #eeeeee;
      font-size: .9rem;
      line-height: 1.55;
    }

    .fila:last-child {
      margin-bottom: 13px;
    }

    .fila .ic {
      color: var(--yellow);
      margin-top: 3px;
    }

    .fila b {
      display: block;
      margin-bottom: 4px;

      color: var(--yellow);
      font-size: .68rem;
      letter-spacing: 2px;
    }

    /* =========================
       6. ICONOS
    ========================== */

    .ic {
      width: 20px;
      height: 20px;
      flex-shrink: 0;

      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =========================
       7. BOTONES
    ========================== */

    .acciones {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;

      width: 100%;
      min-height: 55px;
      padding: 15px 18px;

      border: 1px solid rgba(255,255,255,.65);
      border-radius: 12px;

      color: var(--white);
      background: rgba(15,15,15,.55);

      font-size: .82rem;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-decoration: none;
      text-align: center;

      transition:
        transform .22s ease,
        background-color .22s ease,
        color .22s ease,
        border-color .22s ease,
        box-shadow .22s ease;
    }

    .btn.main {
      min-height: 58px;
      color: #111111;
      background: var(--yellow);
      border-color: var(--yellow);
    }

    .btn .ic {
      width: 19px;
      height: 19px;
    }

    /* Efectos para computador */

    @media (hover: hover) {
      .btn:not(.main):hover {
        color: #111111;
        background: #ffffff;
        border-color: #ffffff;
        transform: translateY(-2px);
      }

      .btn.main:hover {
        background: #ffd04a;
        border-color: #ffd04a;
        transform: translateY(-2px);
        box-shadow: 0 7px 20px rgba(245,184,0,.16);
      }
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 4px;
    }

    /* =========================
       8. PIE DE PÁGINA
    ========================== */

    .footer {
      margin-top: 32px;
      text-align: center;
      color: rgba(255,255,255,.55);
      font-size: .68rem;
      letter-spacing: 1.5px;
    }

    .footer span {
      color: var(--yellow);
    }

    /* =========================
       9. ANIMACIONES
    ========================== */

    .anim {
      opacity: 0;
      animation: aparecer .75s cubic-bezier(.22, 1, .36, 1) both;
      animation-delay: calc(var(--i) * .09s);
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       10. ADAPTACIÓN A CELULARES
    ========================== */

    @media (max-width: 480px) {
      body {
        padding: 45px 20px 25px;
        background-attachment: scroll;
      }

      .contenedor {
        max-width: 390px;
      }

      .info {
        padding: 19px 17px 5px;
      }

      .btn {
        min-height: 54px;
      }
    }

    /* Pantallas pequeñas */

    @media (max-width: 360px) {
      body {
        padding-left: 15px;
        padding-right: 15px;
      }

      .fila {
        font-size: .84rem;
      }

      .btn {
        font-size: .76rem;
      }
    }

    /* Accesibilidad */

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .anim {
        opacity: 1;
        animation: none;
      }

      .btn {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!-- JAVASCRIPT: HORARIO -->

  <script>
    function actualizarEstado() {
      const partes = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Santiago",
        weekday: "short",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());

      const obtener = tipo =>
        partes.find(parte => parte.type === tipo)?.value;

      const dia = obtener("weekday");
      const hora = Number(obtener("hour"));
      const minutos = Number(obtener("minute"));

      const minutosDelDia = hora * 60 + minutos;

      const esDomingo = dia === "Sun";
      const abierto =
        !esDomingo &&
        minutosDelDia >= 600 &&
        minutosDelDia < 1200;

      const estado = document.getElementById("estado");

      estado.textContent = abierto
        ? "Abierto ahora"
        : "Cerrado ahora";

      estado.classList.toggle("on", abierto);
      estado.classList.toggle("off", !abierto);
    }

    actualizarEstado();
    setInterval(actualizarEstado, 60000);
  </script>
