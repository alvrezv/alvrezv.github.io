<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE SIX</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; color: #fff;
      font-family: system-ui, sans-serif;
      background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.88)),
        url("fondo.jpg") center / cover no-repeat;
      display: flex; flex-direction: column; align-items: center;
      padding: 56px 24px 40px;
    }
    .ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor;
          stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 3rem; font-weight: 800; letter-spacing: 2px; line-height: 1; }
    .sub { color: #f5b800; font-weight: 600; letter-spacing: 3px; font-size: .85rem; margin: 10px 0 16px; }
    .estado { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px;
              border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
              font-size: .8rem; margin-bottom: 26px; }
    .estado::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #888; }
    .estado.on::before { background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }
    .estado.off::before { background: #ff5a5a; }
    .info { width: 100%; max-width: 340px; margin-bottom: 26px; }
    .fila { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 18px; line-height: 1.5; font-size: .95rem; }
    .fila .ic { color: #f5b800; margin-top: 2px; }
    .fila b { display: block; color: #f5b800; font-size: .72rem; letter-spacing: 2px; margin-bottom: 2px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px;
           width: 100%; max-width: 340px; padding: 16px; margin-bottom: 12px;
           border: 1px solid #fff; border-radius: 14px; color: #fff; text-decoration: none;
           font-weight: 700; letter-spacing: 1px; transition: transform .15s, background .2s; }
    .btn.main { background: #f5b800; border-color: #f5b800; color: #111; }
    .btn:hover { background: #fff; color: #111; }
    .btn:active { transform: scale(.97); }
    .anim { animation: subir .6s ease both; animation-delay: calc(var(--i) * .08s); }
    @keyframes subir { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .anim { animation: none; } }
  </style>
</head>
<body>
  <h1 class="anim" style="--i:0">THE SIX</h1>
  <p class="sub anim" style="--i:1">BARBERÍA</p>
  <div id="estado" class="estado anim" style="--i:2"></div>

  <div class="info">
    <div class="fila anim" style="--i:3">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <div><b>HORARIO</b>Lunes a sábado · 10:00 – 20:00<br>Domingo cerrado</div>
    </div>
    <div class="fila anim" style="--i:4">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
      <div><b>SERVICIOS</b>Cortes, fade, barba y afeitado con navaja</div>
    </div>
    <div class="fila anim" style="--i:5">
      <svg class="ic" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <div><b>DIRECCIÓN</b>PON_AQUI_LA_DIRECCION</div>
    </div>
  </div>

  <a class="btn main anim" style="--i:6" href="PEGA_TU_LINK_DE_WHATSAPP">
    <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    RESERVAR HORA
  </a>
  <a class="btn anim" style="--i:7" href="PEGA_TU_LINK_DE_MAPS">
    <svg class="ic" viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
    CÓMO LLEGAR
  </a>
  <a class="btn anim" style="--i:8" href="PEGA_TU_LINK_DE_INSTAGRAM">
    <svg class="ic" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
    INSTAGRAM
  </a>
  <a class="btn anim" style="--i:9" href="tel:+569XXXXXXXX">
    <svg class="ic" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    LLAMAR
  </a>

  <script>
    const ahora = new Date(new Date().toLocaleString("en-US", { timeZone: "America/Santiago" }));
    const dia = ahora.getDay(), hora = ahora.getHours() + ahora.getMinutes() / 60;
    const abierto = dia !== 0 && hora >= 10 && hora < 20;
    const el = document.getElementById("estado");
    el.textContent = abierto ? "Abierto ahora" : "Cerrado ahora";
    el.classList.add(abierto ? "on" : "off");
  </script>
</body>
</html>
