
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#111111">
  <meta name="description" content="THE SIX Barbería. Reserva tu hora, conoce nuestros servicios y encuentra nuestra ubicación.">

  <title>THE SIX | Barbería</title>

  <style>
    /* =================================
       1. VARIABLES Y CONFIGURACIÓN
    ================================= */

    :root {
      --black: #101010;
      --white: #ffffff;
      --yellow: #f5b800;
      --grey: #b8b8b8;
      --surface: rgba(18,18,18,.76);
      --ease: cubic-bezier(.22,1,.36,1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      padding: 55px 22px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;

      color: var(--white);
      background-color: var(--black);

      font-family: Arial, Helvetica, sans-serif;
    }

    /* =================================
       2. FONDO CINEMATOGRÁFICO
    ================================= */

    body::before {
      content: "";
      position: fixed;
      inset: -5%;
      z-index: -2;

      background:
        url("fondo.jpg.jpeg") center center / cover no-repeat;

      animation: fondoMovimiento 28s ease-in-out infinite alternate;
      will-change: transform;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.58) 0%,
          rgba(0,0,0,.75) 45%,
          rgba(0,0,0,.94) 100%
        );
    }

    @keyframes fondoMovimiento {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.12);
      }
    }

    /* =================================
       3. CONTENEDOR
    ================================= */

    .contenedor {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* =================================
       4. IDENTIDAD THE SIX
    ================================= */

    .marca {
      text-align: center;
      margin-bottom: 23px;
      opacity: 0;
      animation: entradaMarca 1s var(--ease) .15s forwards;
    }

    h1 {
      font-size: clamp(2.8rem, 12vw, 3.6rem);
      font-weight: 900;
      letter-spacing: 4px;
      line-height: 1;
    }

    .subtitulo {
      color: var(--yellow);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: 5px;
      margin-top: 12px;
    }

    .linea {
      width: 40px;
      height: 2px;
      margin: 20px auto 0;
      background: var(--yellow);
      transform: scaleX(0);
      transform-origin: center;
      animation: dibujarLinea .8s ease 1s forwards;
    }

    @keyframes entradaMarca {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes dibujarLinea {
      to {
        transform: scaleX(1);
      }
    }

    /* =================================
       5. ESTADO DEL LOCAL
    ================================= */

    .estado {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 15px;
      margin-bottom: 30px;

      border: 1px solid rgba(255,255,255,.24);
      border-radius: 50px;
      background: rgba(0,0,0,.35);

      color: #eee;
      font-size: .78rem;
      opacity: 0;
      animation: aparecer .8s var(--ease) .55s forwards;
    }

    .estado::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #888;
    }

    .estado.on::before {
      background: #39d98a;
      box-shadow: 0 0 10px rgba(57,217,138,.6);
      animation: pulso 2s infinite;
    }

    .estado.off::before {
      background: #ff5b5b;
    }

    @keyframes pulso {
      50% {
        box-shadow: 0 0 3px rgba(57,217,138,.2);
      }
    }

    /* =================================
       6. INFORMACIÓN
    ================================= */

    .info {
      width: 100%;
      padding: 21px 20px 7px;
      margin-bottom: 23px;

      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px;

      background: var(--surface);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      transition:
        transform .35s ease,
        border-color .35s ease,
        background .35s ease;

      opacity: 0;
    }

    .fila {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 19px;

      color: #eee;
      font-size: .9rem;
      line-height: 1.55;
    }

    .fila:last-child {
      margin-bottom: 13px;
    }

    .fila .ic {
      color: var(--yellow);
      margin-top: 3px;
    }

    .fila b {
      display: block;
      margin-bottom: 4px;

      color: var(--yellow);
      font-size: .68rem;
      letter-spacing: 2px;
    }

    /* =================================
       7. ICONOS
    ================================= */

    .ic {
      width: 20px;
      height: 20px;
      flex-shrink: 0;

      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =================================
       8. BOTONES
    ================================= */

    .acciones {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .btn {
      position: relative;
      isolation: isolate;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;

      width: 100%;
      min-height: 56px;
      padding: 15px 18px;

      border: 1px solid rgba(255,255,255,.65);
      border-radius: 12px;

      color: var(--white);
      background: rgba(15,15,15,.62);

      font-size: .82rem;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-decoration: none;
      text-align: center;

      opacity: 0;
      transition:
        transform .3s var(--ease),
        background .3s ease,
        color .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
    }

    .btn.main {
      min-height: 59px;
      color: #111;
      background: var(--yellow);
      border-color: var(--yellow);
    }

    .btn .ic {
      width: 19px;
      height: 19px;
      transition: transform .3s var(--ease);
    }

    /* Reflejo que cruza el botón */

    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -120%;
      z-index: -1;

      width: 65%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.17),
        transparent
      );

      transform: skewX(-20deg);
      transition: left .65s ease;
    }

    @media (hover: hover) {
      .btn:hover {
        transform: translateY(-3px);
      }

      .btn:hover::before {
        left: 150%;
      }

      .btn:not(.main):hover {
        color: #111;
        background: #fff;
        border-color: #fff;
        box-shadow: 0 8px 24px rgba(0,0,0,.2);
      }

      .btn.main:hover {
        background: #ffd04a;
        border-color: #ffd04a;
        box-shadow: 0 8px 25px rgba(245,184,0,.23);
      }

      .btn:hover .ic {
        transform: translateY(-2px) scale(1.08);
      }
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 4px;
    }

    /* =================================
       9. PIE DE PÁGINA
    ================================= */

    .footer {
      margin-top: 32px;
      text-align: center;
      color: rgba(255,255,255,.55);
      font-size: .68rem;
      letter-spacing: 1.5px;
    }

    .footer span {
      color: var(--yellow);
    }

    /* =================================
       10. ANIMACIONES DE ENTRADA
    ================================= */

    .revelar {
      opacity: 0;
      transform: translateY(22px);
      transition:
        opacity .8s var(--ease),
        transform .8s var(--ease);
    }

    .revelar.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .acciones .btn:nth-child(1) {
      transition-delay: .05s;
    }

    .acciones .btn:nth-child(2) {
      transition-delay: .12s;
    }

    .acciones .btn:nth-child(3) {
      transition-delay: .19s;
    }

    .acciones .btn:nth-child(4) {
      transition-delay: .26s;
    }

    .acciones .btn:nth-child(5) {
      transition-delay: .33s;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =================================
       11. RESPONSIVE
    ================================= */

    @media (max-width: 480px) {
      body {
        padding: 45px 20px 25px;
      }

      .info {
        padding: 19px 17px 5px;
      }

      .btn {
        min-height: 54px;
      }
    }

    @media (max-width: 360px) {
      body {
        padding-left: 15px;
        padding-right: 15px;
      }

      .fila {
        font-size: .84rem;
      }

      .btn {
        font-size: .76rem;
      }
    }

    /* =================================
       12. ACCESIBILIDAD
    ================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }

      .revelar {
        opacity: 1;
        transform: none;
      }
    }

  </style>
</head>

  <!-- =================================
       JAVASCRIPT
  ================================== -->

  <script>

    /* HORARIO AUTOMÁTICO */

    function actualizarEstado() {

      const partes = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Santiago",
        weekday: "short",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());

      const obtener = tipo =>
        partes.find(parte => parte.type === tipo)?.value;

      const dia = obtener("weekday");
      const hora = Number(obtener("hour"));
      const minutos = Number(obtener("minute"));

      const minutosDelDia = hora * 60 + minutos;

      const esDomingo = dia === "Sun";

      const abierto =
        !esDomingo &&
        minutosDelDia >= 600 &&
        minutosDelDia < 1200;

      const estado = document.getElementById("estado");

      estado.textContent = abierto
        ? "Abierto ahora"
        : "Cerrado ahora";

      estado.classList.toggle("on", abierto);
      estado.classList.toggle("off", !abierto);
    }

    actualizarEstado();
    setInterval(actualizarEstado, 60000);


    /* APARICIÓN AL DESPLAZARSE */

    const elementos = document.querySelectorAll(".revelar");

    if ("IntersectionObserver" in window) {

      const observador = new IntersectionObserver((entradas, observer) => {

        entradas.forEach(entrada => {

          if (entrada.isIntersecting) {
            entrada.target.classList.add("visible");
            observer.unobserve(entrada.target);
          }

        });

      }, {
        threshold: 0.12
      });

      elementos.forEach(elemento => {
        observador.observe(elemento);
      });

    } else {

      elementos.forEach(elemento => {
        elemento.classList.add("visible");
      });

    }

  </script>
