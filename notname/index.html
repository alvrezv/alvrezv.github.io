  <style>
    :root { --fondo:#0b0b0b; --fondo2:#141414; --texto:#f2f2f0; --suave:#9a9a96; --linea:rgba(255,255,255,.14); --acento:#f2f2f0; }
    * { box-sizing: border-box; margin: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--fondo); color: var(--texto); font-family: system-ui, sans-serif; line-height: 1.5; overflow-x: hidden; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

    /* NAV */
    nav { position: sticky; top: 0; z-index: 20; background: rgba(11,11,11,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--linea); }
    nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { display: flex; align-items: center; text-decoration: none; color: var(--texto); font-weight: 800; letter-spacing: 3px; }
    .logo img { height: 28px; width: auto; display: block; }
    .logo-txt { display: none; }
    nav ul { display: flex; gap: 24px; list-style: none; padding: 0; }
    nav ul a { color: var(--suave); text-decoration: none; font-size: .9rem; transition: color .2s; }
    nav ul a:hover { color: var(--texto); }

    /* BOTONES */
    .btn { display: inline-block; padding: 14px 26px; border-radius: 999px; font-weight: 700; text-decoration: none; cursor: pointer; font-size: 1rem; font-family: inherit;
           background: var(--acento); color: #0b0b0b; border: 1px solid var(--acento); transition: transform .15s, background .2s, color .2s; }
    .btn:hover { background: transparent; color: var(--texto); }
    .btn:active { transform: scale(.97); }
    .btn.ghost { background: transparent; color: var(--texto); border-color: var(--linea); }
    .btn.ghost:hover { border-color: var(--texto); }
    .btn.small { padding: 9px 18px; font-size: .85rem; }

    /* HERO */
    .hero { padding: 72px 0 56px; }
    .hero .wrap { display: grid; gap: 48px; align-items: center; }
    .hero h1 { font-size: clamp(2.6rem, 9vw, 5rem); font-weight: 800; line-height: 1; letter-spacing: -2px; }
    .hero p { color: var(--suave); font-size: 1.15rem; max-width: 520px; margin: 24px 0 32px; }
    .acciones { display: flex; gap: 12px; flex-wrap: wrap; }
    .visual { position: relative; display: flex; justify-content: center; min-height: 340px; }
    .placa { width: 280px; height: 280px; }
    .onda { transform-box: fill-box; transform-origin: center; animation: onda 2.4s ease-out infinite; opacity: 0; }
    .onda:nth-of-type(2) { animation-delay: .8s; }
    .onda:nth-of-type(3) { animation-delay: 1.6s; }
    @keyframes onda { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(3); opacity: 0; } }
    .flota { animation: flota 5s ease-in-out infinite; }
    @keyframes flota { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
