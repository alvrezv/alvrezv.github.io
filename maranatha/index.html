<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d2b17">
  <meta name="description" content="Frutería Maranatha. Frutas y verduras. Horarios y ubicación.">
  <title>FRUTERÍA MARANATHA</title>

  <style>
    :root {
      --verde-fondo: #0d2b17;
      --verde: #8bd450;
      --naranja: #ff9a1f;
      --naranja-claro: #ffb04d;
      --crema: #fff7e8;
      --surface: rgba(10,32,18,.78);
      --ease: cubic-bezier(.22,1,.36,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      padding: 50px 22px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      color: var(--crema);
      background:
        radial-gradient(circle at 20% 0%, #1b4a28 0%, transparent 55%),
        radial-gradient(circle at 90% 100%, #1b4a28 0%, transparent 50%),
        var(--verde-fondo);
      font-family: Arial, Helvetica, sans-serif;
    }

    /* FONDO CON FOTO (opcional: sube fondo.jpg a la carpeta) */
    body::before {
      content: "";
      position: fixed;
      inset: -5%;
      z-index: -2;
      background: url("fondo.jpg") center center / cover no-repeat;
      animation: fondoMovimiento 28s ease-in-out infinite alternate;
      will-change: transform;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(8,28,15,.45) 0%, rgba(8,28,15,.7) 50%, rgba(5,20,10,.92) 100%);
    }
    @keyframes fondoMovimiento { from { transform: scale(1); } to { transform: scale(1.12); } }

    /* FRUTAS DE FONDO */
    .frutas { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .frutas svg { position: absolute; opacity: .13; animation: flotar 9s ease-in-out infinite alternate; }
    .frutas .f1 { width: 110px; top: 6%;  left: -20px;  transform: rotate(-15deg); }
    .frutas .f2 { width: 90px;  top: 22%; right: -15px; transform: rotate(20deg);  animation-delay: -3s; }
    .frutas .f3 { width: 100px; top: 52%; left: -25px;  transform: rotate(10deg);  animation-delay: -5s; }
    .frutas .f4 { width: 85px;  top: 68%; right: -10px; transform: rotate(-25deg); animation-delay: -2s; }
    .frutas .f5 { width: 95px;  bottom: 3%; left: 12%;  transform: rotate(18deg);  animation-delay: -7s; }
    @keyframes flotar { to { translate: 0 -18px; } }

    .contenedor {
      position: relative; z-index: 1;
      width: 100%; max-width: 390px;
      display: flex; flex-direction: column; align-items: center;
    }

    /* MARCA */
    .marca { text-align: center; margin-bottom: 23px; opacity: 0; animation: entradaMarca 1s var(--ease) .15s forwards; }
    .fila-frutas { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; }
    .fila-frutas svg { width: 38px; height: 38px; }
    h1 { font-size: clamp(2.2rem, 10vw, 3rem); font-weight: 900; letter-spacing: 3px; line-height: 1.05; }
    h1 span { color: var(--naranja); }
    .subtitulo { color: var(--verde); font-size: .74rem; font-weight: 700; letter-spacing: 4px; margin-top: 12px; }
    .linea { width: 40px; height: 3px; margin: 20px auto 0; border-radius: 3px; background: var(--naranja); transform: scaleX(0); transform-origin: center; animation: dibujarLinea .8s ease 1s forwards; }
    @keyframes entradaMarca { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dibujarLinea { to { transform: scaleX(1); } }

    /* ESTADO (oculto hasta que haya horarios en el script) */
    .estado {
      display: none; align-items: center; gap: 9px;
      padding: 8px 15px; margin-bottom: 30px;
      border: 1px solid rgba(255,247,232,.28); border-radius: 50px;
      background: rgba(0,0,0,.3); font-size: .78rem;
    }
    .estado.visible-estado { display: inline-flex; }
    .estado::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #888; }
    .estado.on::before { background: #39d98a; box-shadow: 0 0 10px rgba(57,217,138,.6); animation: pulso 2s infinite; }
    .estado.off::before { background: #ff5b5b; }
    @keyframes pulso { 50% { box-shadow: 0 0 3px rgba(57,217,138,.2); } }

    /* INFO */
    .info {
      width: 100%; padding: 21px 20px 7px; margin-bottom: 23px;
      border: 1px solid rgba(255,247,232,.16);
      border-left: 4px solid var(--naranja);
      border-radius: 16px;
      background: var(--surface);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      opacity: 0;
    }
    .fila { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 19px; font-size: .9rem; line-height: 1.55; }
    .fila:last-child { margin-bottom: 13px; }
    .fila .ic { color: var(--naranja); margin-top: 3px; }
    .fila b { display: block; margin-bottom: 4px; color: var(--verde); font-size: .68rem; letter-spacing: 2px; }

    .ic { width: 20px; height: 20px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* BOTONES */
    .acciones { width: 100%; display: flex; flex-direction: column; gap: 11px; }
    .btn {
      position: relative; isolation: isolate; overflow: hidden;
      display: flex; align-items: center; justify-content: center; gap: 11px;
      width: 100%; min-height: 56px; padding: 15px 18px;
      border: 1px solid rgba(255,247,232,.6); border-radius: 12px;
      color: var(--crema); background: rgba(8,28,15,.6);
      font-size: .82rem; font-weight: 700; letter-spacing: 1.3px;
      text-decoration: none; text-align: center; opacity: 0;
      transition: transform .3s var(--ease), background .3s ease, color .3s ease, border-color .3s ease, box-shadow .3s ease;
    }
    .btn.main { min-height: 59px; color: #1a1205; background: var(--naranja); border-color: var(--naranja); }
    .btn .ic { width: 19px; height: 19px; transition: transform .3s var(--ease); }
    .btn::before {
      content: ""; position: absolute; top: 0; bottom: 0; left: -120%; z-index: -1; width: 65%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
      transform: skewX(-20deg); transition: left .65s ease;
    }
    @media (hover: hover) {
      .btn:hover { transform: translateY(-3px); }
      .btn:hover::before { left: 150%; }
      .btn:not(.main):hover { color: #0d2b17; background: var(--crema); border-color: var(--crema); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
      .btn.main:hover { background: var(--naranja-claro); border-color: var(--naranja-claro); box-shadow: 0 8px 25px rgba(255,154,31,.3); }
      .btn:hover .ic { transform: translateY(-2px) scale(1.08); }
    }
    .btn:active { transform: scale(.98); }
    .btn:focus-visible { outline: 3px solid var(--verde); outline-offset: 4px; }

    /* FOOTER */
    .footer { margin-top: 32px; text-align: center; color: rgba(255,247,232,.6); font-size: .68rem; letter-spacing: 1.5px; }
    .footer span { color: var(--naranja); }

    /* ANIMACIONES */
    .revelar { opacity: 0; transform: translateY(22px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
    .revelar.visible { opacity: 1; transform: translateY(0); }
    .acciones .btn:nth-child(1) { transition-delay: .05s; }
    .acciones .btn:nth-child(2) { transition-delay: .12s; }

    @media (max-width: 480px) { body { padding: 42px 20px 25px; } .info { padding: 19px 17px 5px; } .btn { min-height: 54px; } }
    @media (max-width: 360px) { body { padding-left: 15px; padding-right: 15px; } .fila { font-size: .84rem; } .btn { font-size: .76rem; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .revelar { opacity: 1; transform: none; }
    }
  </style>
</head>

<body>

  <!-- DIBUJOS DE FRUTAS -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="naranja" viewBox="0 0 100 100">
        <circle cx="50" cy="56" r="36" fill="#ff9a1f"/>
        <path d="M30 44a24 24 0 0 1 14-14" stroke="#ffd08a" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M50 20c2-9 10-14 18-13-1 9-8 15-18 13z" fill="#6fbf3a"/>
      </symbol>
      <symbol id="manzana" viewBox="0 0 100 100">
        <path d="M50 30C32 16 8 30 12 58c4 24 24 36 38 30 14 6 34-6 38-30 4-28-20-42-38-28z" fill="#e63b2e"/>
        <path d="M28 46a20 20 0 0 1 10-12" stroke="#ff8d82" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M50 30c0-8 2-14 7-20" stroke="#5b3a1a" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M54 22c4-8 14-10 20-6-3 8-12 11-20 6z" fill="#6fbf3a"/>
      </symbol>
      <symbol id="limon" viewBox="0 0 100 100">
        <path d="M8 52c0-4 4-6 8-8 6-14 22-24 38-22 14 2 26 14 28 28 4 2 8 4 8 8s-4 6-8 8c-2 14-14 26-28 28-16 2-32-8-38-22-4-2-8-4-8-8z" fill="#f6d928" transform="rotate(-25 50 50)"/>
        <path d="M30 42a22 22 0 0 1 14-12" stroke="#fff3a0" stroke-width="5" stroke-linecap="round" fill="none"/>
      </symbol>
      <symbol id="hoja" viewBox="0 0 100 100">
        <path d="M14 86C10 46 36 16 88 12c2 52-26 78-74 74z" fill="#6fbf3a"/>
        <path d="M14 86C36 62 56 42 80 22" stroke="#3f8a1f" stroke-width="4" stroke-linecap="round" fill="none"/>
      </symbol>
    </defs>
  </svg>

  <div class="frutas" aria-hidden="true">
    <svg class="f1" viewBox="0 0 100 100"><use href="#naranja"/></svg>
    <svg class="f2" viewBox="0 0 100 100"><use href="#hoja"/></svg>
    <svg class="f3" viewBox="0 0 100 100"><use href="#manzana"/></svg>
    <svg class="f4" viewBox="0 0 100 100"><use href="#limon"/></svg>
    <svg class="f5" viewBox="0 0 100 100"><use href="#naranja"/></svg>
  </div>

  <main class="contenedor">

    <header class="marca">
      <div class="fila-frutas" aria-hidden="true">
        <svg viewBox="0 0 100 100"><use href="#naranja"/></svg>
        <svg viewBox="0 0 100 100"><use href="#manzana"/></svg>
        <svg viewBox="0 0 100 100"><use href="#limon"/></svg>
        <svg viewBox="0 0 100 100"><use href="#hoja"/></svg>
      </div>
      <h1>FRUTERÍA<br><span>MARANATHA</span></h1>
      <p class="subtitulo">FRUTERÍA Y VERDULERÍA</p>
      <div class="linea"></div>
    </header>

    <div id="estado" class="estado" aria-live="polite"></div>

    <section class="info revelar" aria-label="Información de la frutería">

      <div class="fila">
        <svg class="ic" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>
        <div>
          <b>HORARIOS</b>
          Lunes a sábado · PONER_HORA – PONER_HORA<br>
          Domingo · PONER_HORARIO_O_CERRADO
        </div>
      </div>

      <div class="fila">
        <svg class="ic" viewBox="0 0 24 24">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <div>
          <b>DIRECCIÓN</b>
          PONER_DIRECCION_ESCRITA
        </div>
      </div>

    </section>

    <nav class="acciones" aria-label="Acciones de Frutería Maranatha">

      <a class="btn main revelar" href="PEGA_LINK_GOOGLE_MAPS" target="_blank" rel="noopener noreferrer">
        <svg class="ic" viewBox="0 0 24 24">
          <polygon points="3 11 22 2 13 21 11 13 3 11"/>
        </svg>
        CÓMO LLEGAR
      </a>

      <a class="btn revelar" href="PEGA_LINK_INSTAGRAM" target="_blank" rel="noopener noreferrer">
        <svg class="ic" viewBox="0 0 24 24">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
        </svg>
        INSTAGRAM
      </a>

    </nav>

    <footer class="footer revelar">
      <p>FRUTERÍA MARANATHA <span>·</span> FRUTAS Y VERDURAS</p>
    </footer>

  </main>

  <script>
    /* HORARIO AUTOMÁTICO ("Abierto ahora / Cerrado ahora")
       Mientras HORARIO sea null, el indicador queda oculto.
       Cuando Bastian entregue los horarios, reemplaza null por esto (ajustando las horas):

       const HORARIO = {
         Mon: ["09:00", "20:00"], Tue: ["09:00", "20:00"], Wed: ["09:00", "20:00"],
         Thu: ["09:00", "20:00"], Fri: ["09:00", "20:00"], Sat: ["09:00", "20:00"],
         Sun: null
       };
    */
    const HORARIO = null;

    const aMinutos = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };

    function actualizarEstado() {
      if (!HORARIO) return;

      const partes = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Santiago",
        weekday: "short",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());

      const obtener = tipo => partes.find(p => p.type === tipo)?.value;
      const dia = obtener("weekday");
      const ahora = Number(obtener("hour")) * 60 + Number(obtener("minute"));

      const turno = HORARIO[dia];
      const abierto = !!turno && ahora >= aMinutos(turno[0]) && ahora < aMinutos(turno[1]);

      const estado = document.getElementById("estado");
      estado.classList.add("visible-estado");
      estado.textContent = abierto ? "Abierto ahora" : "Cerrado ahora";
      estado.classList.toggle("on", abierto);
      estado.classList.toggle("off", !abierto);
    }

    actualizarEstado();
    setInterval(actualizarEstado, 60000);

    /* APARICIÓN AL DESPLAZARSE */
    const elementos = document.querySelectorAll(".revelar");
    if ("IntersectionObserver" in window) {
      const observador = new IntersectionObserver((entradas, observer) => {
        entradas.forEach(entrada => {
          if (entrada.isIntersecting) {
            entrada.target.classList.add("visible");
            observer.unobserve(entrada.target);
          }
        });
      }, { threshold: 0.12 });
      elementos.forEach(el => observador.observe(el));
    } else {
      elementos.forEach(el => el.classList.add("visible"));
    }
  </script>
</body>
</html>
